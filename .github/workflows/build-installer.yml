name: Build installer .exe

# Builds the GUI .exe installer from its .ps1 source in this exact repo/commit, on GitHub's
# own runner -- not on someone's local machine. This is the reproducible-build prerequisite
# for a project-level code-signing program (e.g. SignPath Foundation, https://signpath.org):
# they sign builds their own infrastructure can verify came from the public source, not an
# ad-hoc local compile. Once signing is wired up, add that step where marked below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the built files to (optional; skips upload if empty)"
        required: false
        default: ""
  # Chamado direto pelo release-please.yml quando ele corta uma release: um push de tag feito
  # com o GITHUB_TOKEN padrao (o que o release-please-action usa) nao dispara outros workflows
  # via "on: push: tags" -- e a protecao do GitHub contra loop infinito de Actions. Chamar este
  # workflow como reusable (workflow_call), na mesma run, contorna isso sem precisar de PAT/App.
  workflow_call:
    inputs:
      tag:
        description: "Tag da release recem-criada pelo release-please"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module -Name ps2exe -Force -Scope CurrentUser

      # A versao gravada no .exe sai da tag que disparou o build, senao o executavel
      # continuaria anunciando 1.0.0.0 pra sempre. ps2exe exige quatro campos numericos,
      # entao "v1.2.3" vira "1.2.3.0"; sem tag (workflow_dispatch solto) fica 0.0.0.0.
      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref }}" -replace '^refs/tags/', '' }
          if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $version = "0.0.0.0"
          }
          Write-Host "Versao do .exe: $version (tag: $tag)"
          "EXE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # So a GUI vira .exe. O instalador de terminal tinha um .exe tambem, e ele nao servia pra
      # nada que o .bat nao servisse melhor: o .bat da o mesmo duplo clique, resolve sozinho a
      # ultima release em vez de ficar congelado no que foi compilado, e nao e um binario sem
      # assinatura -- que e justamente o que o SmartScreen avisa e o Controle Inteligente de
      # Aplicativos do Windows 11 recusa de vez. Ter os dois so dava mais um arquivo pra escolher
      # na pagina da release, e o pior dos dois.
      - name: Compile StreamFix-Installer-GUI.exe
        shell: pwsh
        run: |
          Invoke-ps2exe `
            -inputFile "installer/StreamFix-Installer-GUI.ps1" `
            -outputFile "installer/StreamFix-Installer-GUI.exe" `
            -noConsole `
            -title "StreamFix Installer (GUI)" `
            -description "Instala o StreamFix no Equicord ou Vencord, com janela" `
            -product "StreamFix" `
            -version "$env:EXE_VERSION"

      # TODO (apos aprovacao no SignPath Foundation ou programa equivalente): assinar o .exe
      # aqui, antes de calcular o hash e subir como artifact/release asset.

      # Os scripts vao junto dos .exe, e nao so os binarios compilados. Sao eles o ponto de
      # entrada de quem instala no Linux (.sh) e de quem, no Windows, prefere nao rodar um .exe
      # sem assinatura -- e uma release que so traz .exe obriga essa gente a buscar o script no
      # main, que e justamente o que os scripts evitam fazer entre si ao resolver a ultima
      # release para tudo que baixam depois.
      - name: Hash the release files
        shell: pwsh
        run: |
          $files = @(
            "installer/StreamFix-Installer-GUI.exe"
            "installer/StreamFix-Installer.ps1"
            "installer/StreamFix-Installer-GUI.ps1"
            "installer/StreamFix-Installer.bat"
            "installer/streamfix-installer.sh"
            "installer/Verifica-Tunel.ps1"
            "installer/Diagnostico-Tunel.ps1"
            "installer/Diagnostico-Tunel.bat"
          )
          $files | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash)  $(Split-Path -Leaf $_)"
          } | Set-Content "installer/SHA256SUMS.txt"
          Get-Content "installer/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamfix-installer
          path: |
            installer/StreamFix-Installer-GUI.exe
            installer/StreamFix-Installer.ps1
            installer/StreamFix-Installer-GUI.ps1
            installer/StreamFix-Installer.bat
            installer/streamfix-installer.sh
            installer/Verifica-Tunel.ps1
            installer/Diagnostico-Tunel.ps1
            installer/Diagnostico-Tunel.bat
            installer/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF#refs/tags/}"; fi
          # SHA256SUMS.txt vai junto: enquanto o .exe nao e assinado, conferir o hash e a unica
          # forma de quem baixa verificar que o que ele pegou e o que este build produziu.
          gh release upload "$tag" \
            installer/StreamFix-Installer-GUI.exe \
            installer/StreamFix-Installer.ps1 \
            installer/StreamFix-Installer-GUI.ps1 \
            installer/StreamFix-Installer.bat \
            installer/streamfix-installer.sh \
            installer/Verifica-Tunel.ps1 \
            installer/Diagnostico-Tunel.ps1 \
            installer/Diagnostico-Tunel.bat \
            installer/SHA256SUMS.txt \
            --clobber
